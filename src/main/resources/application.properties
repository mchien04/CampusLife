spring.application.name=CampusLife
#server.port=8080
#server.address=0.0.0.0
server.port=${PORT:8080}


# DataSource settings for MySQL
# Supports both local development and Render deployment via environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campuslife_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&connectionTimeZone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Logging settings for debugging
logging.level.org.hibernate.SQL=${LOG_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_BINDER:TRACE}

# Resend Email Configuration
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@campuslife.app}

# Application base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Frontend React App URL (for email links)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
#app.frontend-url=${FRONTEND_URL:https://campus-life-react.vercel.app}

# File Upload Configuration
app.upload.provider=${UPLOAD_PROVIDER:local}
app.upload.dir=${UPLOAD_DIR:uploads}
# Base URL cho uploads

# R2 Configuration (Cloudflare R2)
app.upload.r2.endpoint=${R2_ENDPOINT:}
app.upload.r2.access-key=${R2_ACCESS_KEY:}
app.upload.r2.secret-key=${R2_SECRET_KEY:}
app.upload.r2.bucket=${R2_BUCKET:}
app.upload.r2.cdn-domain=${R2_CDN_DOMAIN:}
app.upload.public-url=${APP_BASE_URL:http://localhost:8080}
app.upload.paths.public-prefix=/uploads
app.upload.paths.general=
app.upload.paths.activity-photos=${UPLOAD_ACTIVITY_PHOTOS_DIR:activities}
app.upload.paths.submissions=${UPLOAD_SUBMISSIONS_DIR:submissions}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
#spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campus-life-react.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
# IMPORTANT: Use a strong random secret in production!
# Set via JWT_SECRET environment variable
jwt.secret=${JWT_SECRET:mySecretKey_12345_or_any_long_random_string}
jwt.expiration=${JWT_EXPIRATION:86400000}


# Quartz
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=${SPRING_QUARTZ_JDBC_INITIALIZE_SCHEMA:always}
# Quartz MySQL
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate

# Reminder Configuration
app.reminder.event.before-days=1
app.reminder.event.before-hours=1
app.reminder.event.before-minutes=0
app.reminder.task.before-days=1
app.reminder.task.before-hours=3
app.reminder.task.before-minutes=0
app.reminder.task.overdue-initial-hours=1
app.reminder.task.overdue-repeat-days=1
app.reminder.task.overdue-initial-minutes=0
app.reminder.task.overdue-repeat-minutes=0
app.reminder.event.no-show-grace-hours=0