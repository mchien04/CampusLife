# R2 Production Profile
app.upload.provider=r2
app.upload.public-url=${APP_BASE_URL}

# R2 credentials (set via Railway environment variables)
app.upload.r2.endpoint=${R2_ENDPOINT}
app.upload.r2.access-key=${R2_ACCESS_KEY}
app.upload.r2.secret-key=${R2_SECRET_KEY}
app.upload.r2.bucket=${R2_BUCKET}
app.upload.r2.cdn-domain=${R2_CDN_DOMAIN}
